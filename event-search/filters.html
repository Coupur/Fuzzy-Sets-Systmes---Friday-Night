<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Event Filters</title>
<style>
  :root {
    --bg: #ffffff;
    --text: #1a1a1a;
    --muted: #666666;
    --track: #e4e4e4;
    --field: #f2f2f2;
    --accent: #2f6fdf;
    --accent-soft: #e6eefc;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161616;
      --text: #f0f0f0;
      --muted: #a0a0a0;
      --track: #3a3a3a;
      --field: #262626;
      --accent: #5b8ef0;
      --accent-soft: #1e2a42;
    }
  }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 16px;
    display: flex;
    justify-content: center;
    padding: 48px 16px;
  }

  main { width: 100%; max-width: 420px; }

  section { margin-bottom: 40px; }

  .head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 16px;
  }
  h2 { font-size: 18px; font-weight: 600; margin: 0; }
  .value { color: var(--muted); }

  /* sliders */
  .slider { position: relative; height: 24px; }
  .track, .fill {
    position: absolute;
    top: 50%;
    height: 4px;
    transform: translateY(-50%);
    border-radius: 2px;
  }
  .track { left: 0; right: 0; background: var(--track); }
  .fill  { background: var(--accent); }

  .slider input {
    position: absolute;
    left: 0;
    width: 100%;
    height: 24px;
    margin: 0;
    background: none;
    -webkit-appearance: none;
    appearance: none;
  }
  .slider.dual input { pointer-events: none; }
  .slider input::-webkit-slider-thumb {
    -webkit-appearance: none;
    pointer-events: auto;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: var(--accent);
    border: none;
    cursor: pointer;
  }
  .slider input::-moz-range-thumb {
    pointer-events: auto;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: var(--accent);
    border: none;
    cursor: pointer;
  }
  .slider input::-moz-range-track { background: none; }
  .slider input:focus-visible::-webkit-slider-thumb { outline: 2px solid var(--text); outline-offset: 2px; }
  .slider input:focus-visible::-moz-range-thumb { outline: 2px solid var(--text); outline-offset: 2px; }

  .ends {
    display: flex;
    justify-content: space-between;
    color: var(--muted);
    font-size: 14px;
    margin-top: 8px;
  }

  /* starting from */
  .from { display: flex; gap: 8px; }
  .from select { flex: 1; }
  .link {
    background: none;
    border: none;
    padding: 0 4px;
    font: inherit;
    font-size: 14px;
    color: var(--accent);
    cursor: pointer;
    white-space: nowrap;
  }
  .note { color: var(--muted); font-size: 14px; margin: 8px 0 0; }

  /* results */
  .sort { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0; }
  .sort button {
    font: inherit; font-size: 14px;
    padding: 6px 12px;
    border: 1px solid var(--track); border-radius: 999px;
    background: none; color: var(--text);
    cursor: pointer;
  }
  .sort button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }

  .results { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 12px; }
  .card {
    display: flex; gap: 14px;
    padding: 14px;
    border: 1px solid var(--track); border-radius: 12px;
  }
  .date-tile {
    flex: none; width: 52px; align-self: flex-start;
    display: flex; flex-direction: column; align-items: center;
    padding: 8px 0;
    background: var(--accent-soft); color: var(--accent);
    border-radius: 10px;
    font-size: 12px; text-transform: uppercase; font-weight: 600;
  }
  .date-tile strong { font-size: 22px; line-height: 1.1; color: var(--text); }
  .card-body { flex: 1; min-width: 0; }
  .card-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .price { font-size: 22px; font-weight: 700; }
  .match {
    flex: none;
    font-size: 13px; font-weight: 600;
    padding: 2px 8px; border-radius: 999px;
    background: var(--accent-soft); color: var(--accent);
  }
  .price-note { color: var(--muted); font-size: 13px; }
  .name { font-size: 17px; font-weight: 600; margin: 8px 0 2px; }
  .meta { color: var(--muted); font-size: 14px; margin-top: 2px; }
  .meta b { color: var(--text); font-weight: 600; }
  .weak-points { font-size: 13px; color: var(--muted); margin-top: 8px; }

  .ruled-out { margin-top: 24px; color: var(--muted); }
  .ruled-out summary { cursor: pointer; font-size: 14px; }
  .ruled-out .card { opacity: 0.6; }
  .ruled-out .results { margin-top: 12px; }

  /* buttons */
  .search {
    width: 100%;
    padding: 12px;
    font: inherit;
    font-weight: 600;
    color: #fff;
    background: var(--accent);
    border: none;
    border-radius: 8px;
    cursor: pointer;
  }
  .search:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
  #output {
    margin-top: 16px;
    padding: 12px;
    background: var(--field);
    border-radius: 6px;
    font-size: 13px;
    white-space: pre-wrap;
    overflow-x: auto;
  }

  /* steps */
  .steps { display: flex; gap: 6px; margin-bottom: 32px; }
  .steps button {
    flex: 1;
    background: none;
    border: none;
    border-top: 4px solid var(--track);
    padding: 8px 0 0;
    font: inherit;
    font-size: 13px;
    color: var(--muted);
    text-align: left;
    cursor: pointer;
  }
  .steps button.done { border-top-color: var(--accent); }
  .steps button[aria-current="step"] { border-top-color: var(--accent); color: var(--text); font-weight: 600; }

  .buttons { display: flex; gap: 12px; }
  .buttons .search { flex: 1; width: auto; }
  .back {
    flex: 1;
    padding: 12px;
    font: inherit;
    font-weight: 600;
    color: var(--text);
    background: var(--field);
    border: none;
    border-radius: 8px;
    cursor: pointer;
  }

  /* checkboxes */
  .times { display: flex; flex-wrap: wrap; gap: 8px 20px; margin-bottom: 20px; }
  .times label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .times input[type="checkbox"] { accent-color: var(--accent); width: 18px; height: 18px; margin: 0; }

  /* importance sliders */
  .importance { margin-top: 20px; }
  .imp-head {
    display: flex;
    justify-content: space-between;
    color: var(--muted);
    font-size: 14px;
    margin-bottom: 4px;
  }

  /* calendar */
  .cal-head { display: flex; justify-content: space-between; align-items: center; font-weight: 600; margin-bottom: 8px; }
  .cal-nav {
    width: 36px; height: 36px;
    border: none; border-radius: 50%;
    background: none;
    color: var(--text);
    font-size: 24px; line-height: 1;
    cursor: pointer;
  }
  .cal-nav:hover { background: var(--field); }
  .cal-nav:disabled { opacity: 0.3; background: none; cursor: default; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); row-gap: 4px; text-align: center; }
  .cal-day-name { color: var(--muted); font-size: 13px; padding: 4px 0; }
  .cal-day {
    position: relative; z-index: 0;
    height: 40px; padding: 0;
    border: none; background: none;
    font: inherit; color: var(--text);
    cursor: pointer;
  }
  .cal-day::before {
    content: "";
    position: absolute; left: 50%; top: 50%; z-index: -1;
    width: 36px; height: 36px;
    transform: translate(-50%, -50%);
    border-radius: 50%;
  }
  .cal-day:hover::before { box-shadow: inset 0 0 0 1px var(--accent); }
  .cal-day:focus-visible { outline: 2px solid var(--text); outline-offset: -2px; }
  .cal-day:disabled { color: var(--muted); opacity: 0.5; cursor: default; }
  .cal-day:disabled::before { box-shadow: none; }
  .cal-day.today { font-weight: 700; }
  .cal-day.between { background: var(--accent-soft); }
  .cal-day.start  { background: linear-gradient(to right, transparent 50%, var(--accent-soft) 50%); }
  .cal-day.finish { background: linear-gradient(to left,  transparent 50%, var(--accent-soft) 50%); }
  .cal-day.picked { color: #fff; font-weight: 600; }
  .cal-day.picked::before { background: var(--accent); }

  select {
    font: inherit;
    font-size: 16px;
    color: var(--text);
    background: var(--field);
    border: none;
    border-radius: 6px;
    padding: 10px 12px;
    width: 100%;
    box-sizing: border-box;
    color-scheme: light dark;
  }
</style>
</head>
<body>
<main>

  <div id="filtersPage">
    <nav class="steps" id="stepNav" aria-label="Steps">
      <button type="button">When</button>
      <button type="button">Price</button>
      <button type="button">Travel</button>
      <button type="button">Keywords</button>
      <button type="button">Group</button>
    </nav>

    <div class="step">
    <section>
      <div class="head">
        <h2>When</h2>
      </div>
      <div class="times">
        <label><input type="checkbox" name="time" value="early evening" checked> Early evening</label>
        <label><input type="checkbox" name="time" value="evening" checked> Evening</label>
        <label><input type="checkbox" name="time" value="night" checked> Night</label>
      </div>
      <div class="calendar">
        <div class="cal-head">
          <button type="button" class="cal-nav" id="calPrev" aria-label="Previous month">&lsaquo;</button>
          <span id="calMonth"></span>
          <button type="button" class="cal-nav" id="calNext" aria-label="Next month">&rsaquo;</button>
        </div>
        <div class="cal-grid" id="calGrid"></div>
        <p class="note" id="calNote"></p>
        <input type="hidden" id="dateFrom">
        <input type="hidden" id="dateTo">
      </div>
    </section>
    </div>

    <div class="step" hidden>
    <section>
      <div class="head">
        <h2>Price</h2>
        <span class="value" id="priceValue"></span>
      </div>
      <div class="slider dual">
        <div class="track"></div>
        <div class="fill" id="priceFill"></div>
        <input type="range" id="priceMin" min="0" max="200" step="5" value="0" aria-label="Minimum price">
        <input type="range" id="priceMax" min="0" max="200" step="5" value="200" aria-label="Maximum price">
      </div>
      <div class="importance">
        <div class="imp-head"><span>How much it matters</span><span id="priceImpValue"></span></div>
        <div class="slider">
          <div class="track"></div>
          <div class="fill" style="left:0"></div>
          <input type="range" id="priceImp" min="0" max="10" step="1" value="5" aria-label="How much price matters">
        </div>
      </div>
    </section>
    </div>

    <div class="step" hidden>
    <section>
      <div class="head">
        <h2>Starting from</h2>
      </div>
      <div class="from">
        <!-- lat,lon -->
        <select id="from" aria-label="Starting from">
          <option value="46.9490,7.4391">Bern HB</option>
          <option value="46.9580,7.4290">Bern Länggasse</option>
          <option value="46.9600,7.4550">Bern Breitenrain</option>
          <option value="46.9240,7.4140">Köniz</option>
          <option value="46.7580,7.6280">Thun</option>
          <option value="46.8030,7.1510">Fribourg</option>
          <option value="47.1370,7.2470">Biel</option>
        </select>
        <button type="button" class="link" id="useMyLocation">Use my location</button>
      </div>
      <p class="note" id="fromNote" hidden></p>
    </section>

    <section>
      <div class="head">
        <h2>Getting there</h2>
      </div>
      <div class="times">
        <label><input type="checkbox" name="mode" value="walk" checked> Walk</label>
        <label><input type="checkbox" name="mode" value="bike"> Bike</label>
        <label><input type="checkbox" name="mode" value="public" checked> Public transport</label>
        <label><input type="checkbox" name="mode" value="car"> Car</label>
        <label><input type="checkbox" name="mode" value="taxi"> Taxi</label>
      </div>
    </section>
    </div>

    <div class="step" hidden>
    <section>
      <div class="head">
        <h2>Energy</h2>
        <span class="value" id="energyValue"></span>
      </div>
      <div class="slider">
        <div class="track"></div>
        <div class="fill" style="left:0"></div>
        <input type="range" id="energy" min="1" max="5" step="1" value="3" aria-label="Energy">
      </div>
      <div class="ends"><span>Drained</span><span>Buzzing</span></div>
      <p class="note">Low: something calm, close by. High: a big night you'd travel for.</p>
      <div class="importance">
        <div class="imp-head"><span>How much it matters</span><span id="energyImpValue"></span></div>
        <div class="slider">
          <div class="track"></div>
          <div class="fill" style="left:0"></div>
          <input type="range" id="energyImp" min="0" max="10" step="1" value="5" aria-label="How much energy matters">
        </div>
      </div>
    </section>

    <section>
      <div class="head">
        <h2>Keywords</h2>
      </div>
      <!-- same list as KEYWORDS in event_data.py -->
      <div class="times">
        <label><input type="checkbox" name="keyword" value="party"> Party</label>
        <label><input type="checkbox" name="keyword" value="dance"> Dance</label>
        <label><input type="checkbox" name="keyword" value="social"> Social</label>
        <label><input type="checkbox" name="keyword" value="quiet"> Quiet</label>
        <label><input type="checkbox" name="keyword" value="creative"> Creative</label>
        <label><input type="checkbox" name="keyword" value="outdoor"> Outdoor</label>
        <label><input type="checkbox" name="keyword" value="food"> Food</label>
        <label><input type="checkbox" name="keyword" value="sport"> Sport</label>
        <label><input type="checkbox" name="keyword" value="pop"> Pop</label>
        <label><input type="checkbox" name="keyword" value="techno"> Techno</label>
        <label><input type="checkbox" name="keyword" value="edm"> EDM</label>
        <label><input type="checkbox" name="keyword" value="made for kids"> Made for kids</label>
        <label><input type="checkbox" name="keyword" value="made for pets"> Made for pets</label>
      </div>
      <div class="importance">
        <div class="imp-head"><span>How much it matters</span><span id="keywordImpValue"></span></div>
        <div class="slider">
          <div class="track"></div>
          <div class="fill" style="left:0"></div>
          <input type="range" id="keywordImp" min="0" max="10" step="1" value="5" aria-label="How much keywords matter">
        </div>
      </div>
    </section>
    </div>

    <div class="step" hidden>
    <section>
      <div class="head">
        <h2>Group size</h2>
      </div>
      <select id="group" aria-label="Group size">
        <option value="1">Just me</option>
        <option value="2" selected>2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
        <option value="6">6</option>
        <option value="8">7–9</option>
        <option value="10">10+</option>
      </select>
      <div class="importance">
        <div class="imp-head"><span>How much it matters</span><span id="groupImpValue"></span></div>
        <div class="slider">
          <div class="track"></div>
          <div class="fill" style="left:0"></div>
          <input type="range" id="groupImp" min="0" max="10" step="1" value="5" aria-label="How much group size matters">
        </div>
      </div>
    </section>

    <section>
      <div class="head">
        <h2>Kids</h2>
      </div>
      <div class="times">
        <label><input type="checkbox" id="kids"> Bringing kids</label>
      </div>
      <div id="kidsRating" hidden>
        <select id="rating" aria-label="Highest rating that's OK for the kids">
          <option value="G">G: all ages</option>
          <option value="PG" selected>PG: 6+</option>
          <option value="PG-13">PG-13: 12+</option>
          <option value="R">R: 16+</option>
        </select>
      </div>
      <div class="importance" id="kidsImportance" hidden>
        <div class="imp-head"><span>How much it matters</span><span id="kidsImpValue"></span></div>
        <div class="slider">
          <div class="track"></div>
          <div class="fill" style="left:0"></div>
          <input type="range" id="kidsImp" min="0" max="10" step="1" value="5" aria-label="How much the rating matters">
        </div>
      </div>
    </section>
    </div>

    <div class="buttons">
      <button type="button" class="back" id="back">Back</button>
      <button type="button" class="search" id="next">Next</button>
    </div>
  </div>

  <div id="resultsPage" hidden>
    <div class="head">
      <h2>Your Friday night</h2>
      <button type="button" class="link" id="edit">Change answers</button>
    </div>
    <p class="note" id="summary"></p>
    <div class="sort" id="sortBar" hidden>
      <button type="button" data-sort="best" aria-pressed="true">Best match</button>
      <button type="button" data-sort="cheapest" aria-pressed="false">Cheapest</button>
      <button type="button" data-sort="closest" aria-pressed="false">Closest</button>
      <button type="button" data-sort="soonest" aria-pressed="false">Soonest</button>
    </div>
    <ol class="results" id="results"></ol>
    <details class="ruled-out" id="ruledOut" hidden>
      <summary id="ruledOutTitle"></summary>
      <ol class="results" id="ruledOutList"></ol>
    </details>
    <pre id="output" hidden></pre>
  </div>

</main>

<script>
  const $ = id => document.getElementById(id);
  const pct = input => (input.value - input.min) / (input.max - input.min) * 100;

  function setupSlider(input, showValue) {
    const fill = input.parentElement.querySelector(".fill");
    function update() {
      fill.style.right = (100 - pct(input)) + "%";
      showValue(Number(input.value));
    }
    input.addEventListener("input", update);
    update();
  }

  // energy 1-5 shown as Marlene's words
  const ENERGY_WORDS = ["drained", "tired", "okay", "good", "buzzing"];
  const energyWord = () => ENERGY_WORDS[Number($("energy").value) - 1];
  setupSlider($("energy"), () => {
    const w = energyWord();
    $("energyValue").textContent = w[0].toUpperCase() + w.slice(1);
  });

  for (const id of ["energyImp", "priceImp", "groupImp", "kidsImp", "keywordImp"]) {
    setupSlider($(id), v => { $(id + "Value").textContent = v + "/10"; });
  }

  $("kids").addEventListener("change", () => {
    $("kidsRating").hidden = !$("kids").checked;
    $("kidsImportance").hidden = !$("kids").checked;
  });

  // calendar: click a day, then a later day to make it a range
  const iso = d => new Date(d.getTime() - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10);
  const today = new Date();
  const nextWeek = new Date(today.getTime() + 7 * 864e5);
  const thisMonth = new Date(today.getFullYear(), today.getMonth(), 1);
  const calendar = { from: iso(today), to: iso(nextWeek), month: thisMonth };

  const longDate = date => new Date(date + "T12:00")
    .toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" });

  function pickDay(date) {
    if (calendar.to || date < calendar.from) {
      calendar.from = date;
      calendar.to = null;
    } else if (date > calendar.from) {
      calendar.to = date;
    }
    drawCalendar();
  }

  function drawCalendar() {
    const { from, to, month } = calendar;
    $("calMonth").textContent = month.toLocaleDateString("en-GB", { month: "long", year: "numeric" });
    $("calPrev").disabled = month <= thisMonth;

    const grid = $("calGrid");
    grid.innerHTML = "";
    for (const name of ["M", "T", "W", "T", "F", "S", "S"]) {
      const head = document.createElement("span");
      head.className = "cal-day-name";
      head.textContent = name;
      grid.append(head);
    }
    // weeks start on Monday
    const blanks = (month.getDay() + 6) % 7;
    for (let i = 0; i < blanks; i++) grid.append(document.createElement("span"));

    const daysInMonth = new Date(month.getFullYear(), month.getMonth() + 1, 0).getDate();
    for (let n = 1; n <= daysInMonth; n++) {
      const date = iso(new Date(month.getFullYear(), month.getMonth(), n));
      const day = document.createElement("button");
      day.type = "button";
      day.className = "cal-day";
      day.textContent = n;
      day.setAttribute("aria-label", longDate(date));
      day.disabled = date < iso(today);
      if (date === iso(today)) day.classList.add("today");
      if (date === from || date === to) day.classList.add("picked");
      if (to) {
        if (date === from) day.classList.add("start");
        if (date === to) day.classList.add("finish");
        if (date > from && date < to) day.classList.add("between");
      }
      day.addEventListener("click", () => pickDay(date));
      grid.append(day);
    }

    $("dateFrom").value = from;
    $("dateTo").value = to || from;
    $("calNote").textContent = to
      ? `${longDate(from)} to ${longDate(to)}`
      : `${longDate(from)} only. Click a later day to pick a range.`;
  }

  function moveMonth(step) {
    calendar.month = new Date(calendar.month.getFullYear(), calendar.month.getMonth() + step, 1);
    drawCalendar();
  }
  $("calPrev").addEventListener("click", () => moveMonth(-1));
  $("calNext").addEventListener("click", () => moveMonth(1));
  drawCalendar();

  // price
  function updatePrice(e) {
    const minEl = $("priceMin"), maxEl = $("priceMax");
    let lo = Number(minEl.value), hi = Number(maxEl.value);
    if (lo > hi) {
      if (e && e.target === minEl) minEl.value = lo = hi;
      else maxEl.value = hi = lo;
    }
    $("priceFill").style.left = pct(minEl) + "%";
    $("priceFill").style.right = (100 - pct(maxEl)) + "%";
    minEl.style.zIndex = lo >= Number(minEl.max) - Number(minEl.step) ? 2 : 1;
    const top = Number(maxEl.max);
    $("priceValue").textContent = "CHF " + lo + " to " + hi + (hi === top ? "+" : "");
  }
  $("priceMin").addEventListener("input", updatePrice);
  $("priceMax").addEventListener("input", updatePrice);
  updatePrice();

  // use my location
  $("useMyLocation").addEventListener("click", () => {
    const note = $("fromNote");
    note.hidden = false;
    if (!navigator.geolocation) {
      note.textContent = "This browser can't share a location. Pick a place from the list.";
      return;
    }
    note.textContent = "Finding you…";
    navigator.geolocation.getCurrentPosition(
      pos => {
        const option = document.createElement("option");
        option.value = pos.coords.latitude.toFixed(4) + "," + pos.coords.longitude.toFixed(4);
        option.textContent = "My location";
        $("from").prepend(option);
        $("from").value = option.value;
        note.hidden = true;
      },
      () => { note.textContent = "Couldn't get your location. Pick a place from the list."; }
    );
  });

  // everything the page sends to app.py
  const checked = name => [...document.querySelectorAll(`input[name="${name}"]:checked`)].map(c => c.value);

  function getFilters() {
    const fromOption = $("from").selectedOptions[0];
    const [lat, lon] = fromOption.value.split(",").map(Number);
    return {
      energy: { level: Number($("energy").value), word: energyWord(), importance: Number($("energyImp").value) },
      times: checked("time"),
      dateFrom: $("dateFrom").value,
      dateTo: $("dateTo").value,
      money: { min: Number($("priceMin").value), max: Number($("priceMax").value), importance: Number($("priceImp").value) },
      group: { size: Number($("group").value), importance: Number($("groupImp").value) },
      kids_ok: $("kids").checked
        ? { rating: $("rating").value, importance: Number($("kidsImp").value) }
        : null,
      keywords: checked("keyword"),
      keyword_importance: Number($("keywordImp").value),
      from: { name: fromOption.textContent, lat, lon },
      modes: checked("mode"),
    };
  }

  // results page
  const MODE_LABEL = { walk: "Walk", bike: "Bike", public: "Public transport", car: "Car", taxi: "Taxi" };
  const SCORE_LABEL = { time: "Time", trip: "Trip", vibe: "Vibe", price: "Price",
                        group: "Group", kids: "Kids", keywords: "Keywords" };

  const chf = x => "CHF " + (x % 1 ? x.toFixed(2) : x);
  const clock = hour => Math.floor(hour) + ":" + (hour % 1 ? "30" : "00");
  const dateParts = date => {
    const d = new Date(date + "T12:00");
    return {
      weekday: d.toLocaleDateString("en-GB", { weekday: "short" }),
      day: d.getDate(),
      month: d.toLocaleDateString("en-GB", { month: "short" }),
    };
  };

  function el(tag, className, text) {
    const e = document.createElement(tag);
    if (className) e.className = className;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  function eventCard(ev) {
    const card = el("li", "card");

    const d = dateParts(ev.date);
    const tile = el("div", "date-tile");
    tile.append(el("span", "", d.weekday), el("strong", "", d.day), el("span", "", d.month));

    const body = el("div", "card-body");

    const top = el("div", "card-top");
    top.append(el("span", "price", ev.total_cost === 0 ? "Free" : chf(ev.total_cost)),
               el("span", "match", Math.round(ev.score * 100) + "% match"));
    const ticket = ev.price === 0 ? "free entry" : "ticket " + chf(ev.price);
    const travel = ev.trip.cost_each === 0 ? "free to get there" : "travel " + chf(ev.trip.cost_each);
    const priceNote = el("div", "price-note", `per person · ${ticket} + ${travel}`);

    const name = el("div", "name", ev.name);
    const when = el("div", "meta", `${clock(ev.start)} · ${ev.venue} · rated ${ev.rating}`);

    const trip = el("div", "meta");
    trip.append(el("b", "", ev.trip.km + " km away"),
                ` · ${MODE_LABEL[ev.trip.mode]}, ${ev.trip.minutes} min`);
    const others = ev.trip.options
      .filter(o => o.mode !== ev.trip.mode && o.minutes <= 120)
      .map(o => `${MODE_LABEL[o.mode].toLowerCase()} ${o.minutes} min`
              + (o.cost_each === 0 ? "" : ` (${chf(o.cost_each)})`));
    body.append(top, priceNote, name, when, trip);
    if (others.length) body.append(el("div", "meta", "or " + others.join(", ")));

    // scores under 100%, worst first
    const weak = Object.entries(ev.scores)
      .filter(([, v]) => v < 1)
      .sort((a, b) => a[1] - b[1]);
    if (ev.score === 0) {
      const reasons = weak.filter(([, v]) => v === 0).map(([k]) => SCORE_LABEL[k] || k);
      body.append(el("div", "weak-points", "Ruled out by: " + reasons.join(", ")));
    } else if (weak.length) {
      const text = weak.map(([k, v]) => `${SCORE_LABEL[k] || k} ${Math.round(v * 100)}%`).join(" · ");
      body.append(el("div", "weak-points", "Not perfect: " + text));
    }

    card.append(tile, body);
    return card;
  }

  const SORTS = {
    best:     (a, b) => b.score - a.score,
    cheapest: (a, b) => a.total_cost - b.total_cost,
    closest:  (a, b) => a.trip.km - b.trip.km,
    soonest:  (a, b) => (a.date + a.start).localeCompare(b.date + b.start),
  };
  let lastEvents = [];
  let sortBy = "best";

  function showResults(events) {
    lastEvents = events;
    const good = events.filter(ev => ev.score > 0).sort(SORTS[sortBy]);
    const out = events.filter(ev => ev.score === 0);

    $("results").replaceChildren(...good.map(eventCard));
    if (good.length === 0) $("results").append(el("li", "note", "Nothing fits. Try other dates or change your answers."));

    $("ruledOut").hidden = out.length === 0;
    $("ruledOutTitle").textContent = `${out.length} ruled out`;
    $("ruledOutList").replaceChildren(...out.map(eventCard));
    $("sortBar").hidden = good.length < 2;
  }

  for (const button of document.querySelectorAll("#sortBar button")) {
    button.addEventListener("click", () => {
      sortBy = button.dataset.sort;
      for (const b of document.querySelectorAll("#sortBar button")) {
        b.setAttribute("aria-pressed", b === button ? "true" : "false");
      }
      showResults(lastEvents);
    });
  }

  function summaryText(f) {
    const day = d => new Date(d + "T12:00").toLocaleDateString("en-GB", { day: "numeric", month: "short" });
    return `${day(f.dateFrom)} to ${day(f.dateTo)} · CHF ${f.money.min} to ${f.money.max}`
         + ` · from ${f.from.name} · ${f.energy.word}`;
  }

  async function search() {
    const filters = getFilters();
    const out = $("output");
    $("filtersPage").hidden = true;
    $("resultsPage").hidden = false;
    $("summary").textContent = summaryText(filters);
    try {
      const res = await fetch("/api/search", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(filters),
      });
      if (!res.ok) throw new Error(res.status);
      const events = await res.json();
      out.hidden = true;
      $("summary").textContent = `${events.length} events · ` + summaryText(filters);
      showResults(events);
    } catch {
      $("results").innerHTML = "";
      $("sortBar").hidden = true;
      $("ruledOut").hidden = true;
      out.hidden = false;
      out.textContent = "Back end not running (start it with: python app.py).\n"
                      + "This is what Search sends:\n\n" + JSON.stringify(filters, null, 2);
    }
  }

  // steps
  const steps = [...document.querySelectorAll(".step")];
  const stepButtons = [...document.querySelectorAll("#stepNav button")];
  let current = 0;

  function showStep(i) {
    current = i;
    steps.forEach((step, n) => { step.hidden = n !== i; });
    stepButtons.forEach((b, n) => {
      b.classList.toggle("done", n < i);
      if (n === i) b.setAttribute("aria-current", "step"); else b.removeAttribute("aria-current");
    });
    $("back").hidden = i === 0;
    $("next").textContent = i === steps.length - 1 ? "Search" : "Next";
    $("filtersPage").hidden = false;
    $("resultsPage").hidden = true;
    window.scrollTo(0, 0);
  }

  stepButtons.forEach((b, n) => b.addEventListener("click", () => showStep(n)));
  $("back").addEventListener("click", () => showStep(current - 1));
  $("next").addEventListener("click", () => {
    if (current < steps.length - 1) showStep(current + 1);
    else search();
  });
  $("edit").addEventListener("click", () => showStep(current));
  showStep(0);

</script>
</body>
</html>
