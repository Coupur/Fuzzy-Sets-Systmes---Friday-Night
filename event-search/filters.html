<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Event Filters</title>
<style>
  :root {
    --bg: #ffffff;
    --text: #1a1a1a;
    --muted: #666666;
    --track: #e4e4e4;
    --field: #f2f2f2;
    --accent: #2f6fdf;
    --accent-soft: #e6eefc;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161616;
      --text: #f0f0f0;
      --muted: #a0a0a0;
      --track: #3a3a3a;
      --field: #262626;
      --accent: #5b8ef0;
      --accent-soft: #1e2a42;
    }
  }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 16px;
    display: flex;
    justify-content: center;
    padding: 48px 16px;
  }

  main { width: 100%; max-width: 420px; }

  section { margin-bottom: 40px; }

  .head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 16px;
  }
  h2 { font-size: 18px; font-weight: 600; margin: 0; }
  .value { color: var(--muted); }

  /* Sliders */
  .slider { position: relative; height: 24px; }
  .track, .fill {
    position: absolute;
    top: 50%;
    height: 4px;
    transform: translateY(-50%);
    border-radius: 2px;
  }
  .track { left: 0; right: 0; background: var(--track); }
  .fill  { background: var(--accent); }

  .slider input {
    position: absolute;
    left: 0;
    width: 100%;
    height: 24px;
    margin: 0;
    background: none;
    -webkit-appearance: none;
    appearance: none;
  }
  .slider.dual input { pointer-events: none; }
  .slider input::-webkit-slider-thumb {
    -webkit-appearance: none;
    pointer-events: auto;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: var(--accent);
    border: none;
    cursor: pointer;
  }
  .slider input::-moz-range-thumb {
    pointer-events: auto;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: var(--accent);
    border: none;
    cursor: pointer;
  }
  .slider input::-moz-range-track { background: none; }
  .slider input:focus-visible::-webkit-slider-thumb { outline: 2px solid var(--text); outline-offset: 2px; }
  .slider input:focus-visible::-moz-range-thumb { outline: 2px solid var(--text); outline-offset: 2px; }

  .ends {
    display: flex;
    justify-content: space-between;
    color: var(--muted);
    font-size: 14px;
    margin-top: 8px;
  }

  /* Starting from */
  .from { display: flex; gap: 8px; }
  .from select { flex: 1; }
  .link {
    background: none;
    border: none;
    padding: 0 4px;
    font: inherit;
    font-size: 14px;
    color: var(--accent);
    cursor: pointer;
    white-space: nowrap;
  }
  .note { color: var(--muted); font-size: 14px; margin: 8px 0 0; }

  /* Results */
  .results { list-style: none; padding: 0; margin: 16px 0 0; }
  .results li { padding: 14px 0; border-bottom: 1px solid var(--track); }
  .results .top { display: flex; justify-content: space-between; gap: 12px; font-weight: 600; }
  .results .score { color: var(--accent); }
  .results .trip { margin-top: 4px; }
  .results .other { color: var(--muted); font-size: 14px; margin-top: 2px; }
  .results .other span { white-space: nowrap; margin-right: 14px; }

  /* Search */
  .search {
    width: 100%;
    padding: 12px;
    font: inherit;
    font-weight: 600;
    color: #fff;
    background: var(--accent);
    border: none;
    border-radius: 8px;
    cursor: pointer;
  }
  .search:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
  #output {
    margin-top: 16px;
    padding: 12px;
    background: var(--field);
    border-radius: 6px;
    font-size: 13px;
    white-space: pre-wrap;
    overflow-x: auto;
  }

  /* Time and date */
  .times { display: flex; flex-wrap: wrap; gap: 8px 20px; margin-bottom: 20px; }
  .times label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .times input { accent-color: var(--accent); width: 18px; height: 18px; margin: 0; }

  .dates { display: flex; gap: 12px; }
  .dates label { flex: 1; display: flex; flex-direction: column; gap: 6px; color: var(--muted); font-size: 14px; }

  input[type="date"], select {
    font: inherit;
    font-size: 16px;
    color: var(--text);
    background: var(--field);
    border: none;
    border-radius: 6px;
    padding: 10px 12px;
    width: 100%;
    box-sizing: border-box;
    color-scheme: light dark;
  }
</style>
</head>
<body>
<main>

  <section>
    <div class="head">
      <h2>Energy</h2>
      <span class="value" id="energyValue">5</span>
    </div>
    <div class="slider">
      <div class="track"></div>
      <div class="fill" id="energyFill" style="left:0"></div>
      <input type="range" id="energy" min="0" max="10" step="1" value="5" aria-label="Energy">
    </div>
    <div class="ends"><span>Chill</span><span>Wild</span></div>
  </section>

  <section>
    <div class="head">
      <h2>When</h2>
    </div>
    <div class="times">
      <label><input type="checkbox" name="time" value="early" checked> Early evening</label>
      <label><input type="checkbox" name="time" value="mid" checked> Mid evening</label>
      <label><input type="checkbox" name="time" value="late" checked> Late night</label>
    </div>
    <div class="dates">
      <label>From <input type="date" id="dateFrom"></label>
      <label>To <input type="date" id="dateTo"></label>
    </div>
  </section>

  <section>
    <div class="head">
      <h2>Price</h2>
      <span class="value" id="priceValue"></span>
    </div>
    <div class="slider dual">
      <div class="track"></div>
      <div class="fill" id="priceFill"></div>
      <input type="range" id="priceMin" min="0" max="200" step="5" value="0" aria-label="Minimum price">
      <input type="range" id="priceMax" min="0" max="200" step="5" value="200" aria-label="Maximum price">
    </div>
  </section>

  <section>
    <div class="head">
      <h2>Group size</h2>
    </div>
    <select id="group" aria-label="Group size">
      <option value="1">Just me</option>
      <option value="2" selected>2</option>
      <option value="3">3</option>
      <option value="4">4</option>
      <option value="5">5</option>
      <option value="6">6</option>
      <option value="8">7–9</option>
      <option value="10">10+</option>
    </select>
  </section>

  <section>
    <div class="head">
      <h2>Starting from</h2>
    </div>
    <div class="from">
      <!-- value = "latitude,longitude" -->
      <select id="from" aria-label="Starting from">
        <option value="46.9490,7.4391">Bern HB</option>
        <option value="46.9580,7.4290">Bern Länggasse</option>
        <option value="46.9600,7.4550">Bern Breitenrain</option>
        <option value="46.9240,7.4140">Köniz</option>
        <option value="46.7580,7.6280">Thun</option>
        <option value="46.8030,7.1510">Fribourg</option>
        <option value="47.1370,7.2470">Biel</option>
      </select>
      <button type="button" class="link" id="useMyLocation">Use my location</button>
    </div>
    <p class="note" id="fromNote" hidden></p>
  </section>

  <section>
    <div class="head">
      <h2>Getting there</h2>
    </div>
    <div class="times">
      <label><input type="checkbox" name="mode" value="walk" checked> Walk</label>
      <label><input type="checkbox" name="mode" value="bike"> Bike</label>
      <label><input type="checkbox" name="mode" value="public" checked> Public transport</label>
      <label><input type="checkbox" name="mode" value="car"> Car</label>
      <label><input type="checkbox" name="mode" value="taxi"> Taxi</label>
    </div>
  </section>

  <button type="button" class="search" id="search">Search</button>
  <ol class="results" id="results"></ol>
  <pre id="output" hidden></pre>

</main>

<script>
  const $ = id => document.getElementById(id);
  const pct = input => (input.value - input.min) / (input.max - input.min) * 100;

  // Energy
  function updateEnergy() {
    $("energyFill").style.right = (100 - pct($("energy"))) + "%";
    $("energyValue").textContent = $("energy").value;
  }
  $("energy").addEventListener("input", updateEnergy);
  updateEnergy();

  // Dates: default to today through one week from today
  const iso = d => new Date(d.getTime() - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10);
  const today = new Date();
  const nextWeek = new Date(today.getTime() + 7 * 864e5);
  $("dateFrom").value = $("dateFrom").min = $("dateTo").min = iso(today);
  $("dateTo").value = iso(nextWeek);
  $("dateFrom").addEventListener("change", () => {
    $("dateTo").min = $("dateFrom").value;
    if ($("dateTo").value < $("dateFrom").value) $("dateTo").value = $("dateFrom").value;
  });

  // Price (min/max)
  function updatePrice(e) {
    const minEl = $("priceMin"), maxEl = $("priceMax");
    let lo = Number(minEl.value), hi = Number(maxEl.value);
    if (lo > hi) {
      if (e && e.target === minEl) minEl.value = lo = hi;
      else maxEl.value = hi = lo;
    }
    $("priceFill").style.left = pct(minEl) + "%";
    $("priceFill").style.right = (100 - pct(maxEl)) + "%";
    minEl.style.zIndex = lo >= Number(minEl.max) - Number(minEl.step) ? 2 : 1;
    const top = Number(maxEl.max);
    $("priceValue").textContent = "CHF " + lo + " to " + hi + (hi === top ? "+" : "");
  }
  $("priceMin").addEventListener("input", updatePrice);
  $("priceMax").addEventListener("input", updatePrice);
  updatePrice();

  // Starting from: "Use my location" asks the browser, and adds it to the list
  $("useMyLocation").addEventListener("click", () => {
    const note = $("fromNote");
    note.hidden = false;
    if (!navigator.geolocation) {
      note.textContent = "This browser can't share a location. Pick a place from the list.";
      return;
    }
    note.textContent = "Finding you…";
    navigator.geolocation.getCurrentPosition(
      pos => {
        const option = document.createElement("option");
        option.value = pos.coords.latitude.toFixed(4) + "," + pos.coords.longitude.toFixed(4);
        option.textContent = "My location";
        $("from").prepend(option);
        $("from").value = option.value;
        note.hidden = true;
      },
      () => { note.textContent = "Couldn't get your location. Pick a place from the list."; }
    );
  });

  // 1. UI function: collect every answer on the page. This is the JSON the back end receives.
  function getFilters() {
    const fromOption = $("from").selectedOptions[0];
    const [lat, lon] = fromOption.value.split(",").map(Number);
    return {
      energy: Number($("energy").value),
      times: [...document.querySelectorAll('input[name="time"]:checked')].map(c => c.value),
      dateFrom: $("dateFrom").value,
      dateTo: $("dateTo").value,
      priceMin: Number($("priceMin").value),
      priceMax: Number($("priceMax").value),
      group: $("group").value,
      from: { name: fromOption.textContent, lat, lon },
      modes: [...document.querySelectorAll('input[name="mode"]:checked')].map(c => c.value),
    };
  }

  // Show the ranked events that come back from rank_events() in Python
  const MODE_LABEL = { walk: "Walk", bike: "Bike", public: "Public transport", car: "Car", taxi: "Taxi" };
  const tripText = o => `${MODE_LABEL[o.mode]} ${o.minutes} min · ` +
                        (o.cost_each === 0 ? "free" : `CHF ${o.cost_each.toFixed(2)} each`);

  function showResults(events) {
    const list = $("results");
    list.innerHTML = "";
    for (const ev of events) {
      const li = document.createElement("li");

      const top = document.createElement("div");
      top.className = "top";
      const name = document.createElement("span");
      name.textContent = ev.name;
      const score = document.createElement("span");
      score.className = "score";
      score.textContent = Math.round(ev.score * 100) + "%";
      top.append(name, score);

      // the way the code picked
      const trip = document.createElement("div");
      trip.className = "trip";
      trip.textContent = tripText(ev.trip) + ` · ${ev.trip.km} km`;

      // the other ways, greyed out
      const other = document.createElement("div");
      other.className = "other";
      for (const o of ev.trip.options) {
        if (o.mode === ev.trip.mode) continue;
        const span = document.createElement("span");
        span.textContent = tripText(o);
        other.appendChild(span);
      }

      li.append(top, trip, other);
      list.appendChild(li);
    }
  }

  // Search: send the answers to Python, show what comes back.
  $("search").addEventListener("click", async () => {
    const filters = getFilters();
    const out = $("output");
    try {
      const res = await fetch("/api/search", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(filters),
      });
      if (!res.ok) throw new Error(res.status);
      out.hidden = true;
      showResults(await res.json());
    } catch {
      $("results").innerHTML = "";
      out.hidden = false;
      out.textContent = "Back end not running (start it with: python app.py).\n"
                      + "This is what Search sends:\n\n" + JSON.stringify(filters, null, 2);
    }
  });

  window.getFilters = getFilters;
</script>
</body>
</html>
